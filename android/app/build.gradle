plugins {
    id 'com.android.application'
}

android {
    namespace 'com.orvyn.app'
    compileSdk 34

    defaultConfig {
        applicationId "com.orvyn.app"
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName "1.0"
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    // No external dependencies required - native WebView application
}